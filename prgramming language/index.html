<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>C++ Practice Playground · by Ahmad Mandozai</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="title">
      <i class="fas fa-code"></i>
      <h1>C++ Practice Engine</h1>
    </div>
    <div class="badges">
      <a
        class="dev-badge"
        href="https://ma-ahmad-profile.netlify.app/"
        target="_blank"
        rel="noopener"
        title="Visit Ahmad Mandozai's profile"
      >
        <i class="fas fa-user-astronaut"></i>
        <span>Developed by Ahmad Mandozai</span>
      </a>
      <span class="status-badge">
        <i class="fas fa-circle"></i>
        <span>Powered by OneCompiler</span>
      </span>
    </div>
  </header>

  <div class="iframe-container">
    <iframe
      id="oc-editor"
      src="https://onecompiler.com/embed/cpp?theme=dark&hideStdin=true&hideNew=true&fontSize=16"
      title="C++ Practice Playground"
      allow="clipboard-write"
    ></iframe>
  </div>

  <footer>
    Developed with <span class="heart"><i class="fas fa-heart"></i></span> by
    <a href="https://ma-ahmad-profile.netlify.app/" target="_blank" rel="noopener">
      Ahmad Mandozai
    </a>
    <span class="separator">·</span>
    Compilation magic by
    <a href="https://onecompiler.com" target="_blank" rel="noopener">
      OneCompiler
    </a>
  </footer>
</body>
</html>
